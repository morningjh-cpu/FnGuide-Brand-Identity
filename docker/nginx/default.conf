# The shared nginx-proxy must supply a trusted X-Forwarded-For chain.
# Apply this policy to every asset, including direct font and ZIP downloads.
map $http_x_forwarded_for $client_ip {
    "~^(?<first_ip>[^,\s]+)" $first_ip;
    default                  $remote_addr;
}

geo $client_ip $ip_allowed {
    default          0;
    175.197.248.0/25 1;
    10.100.0.0/16    1;
    10.210.0.0/16    1;
    175.198.62.145   1;
}

server {
    listen 0.0.0.0:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    location = /api/health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","ts":"$time_iso8601"}';
    }

    location / {
        if ($ip_allowed = 0) { return 403; }
        # Navigation uses URL fragments; missing assets must remain 404.
        try_files $uri $uri/ =404;
    }
}
